services:
  frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env
    environment:
      BACKEND_PUBLIC_URL: http://backend:8080
    ports:
      - "3000:3000"

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
